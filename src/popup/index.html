<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Copy 2 Markdown</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body class="popup-document">
    <main class="popup">
      <header class="header" aria-label="Copy 2 Markdown">
        <picture class="brand-mark">
          <source srcset="../icons/dark/icon-master.svg" media="(prefers-color-scheme: dark)" />
          <img src="../icons/light/icon-master.svg" alt="" width="42" height="42" />
        </picture>
      </header>
      <section class="actions" aria-label="Copy actions">
        <button class="action" type="button" data-action="page" disabled>
          <span class="action-icon" aria-hidden="true"></span>
          <span class="action-label" data-copy="actions.copyPage"></span>
        </button>
        <button class="action" type="button" data-action="link" disabled>
          <span class="action-icon" aria-hidden="true"></span>
          <span class="action-label" data-copy="actions.copyLink"></span>
        </button>
      </section>
      <aside class="shortcut-card" aria-label="Keyboard shortcuts" hidden>
        <span class="shortcut-info-icon" id="shortcut-info-icon" aria-hidden="true"></span>
        <div class="shortcut-content">
          <h2 data-copy="notifications.shortcutsTitle"></h2>
          <ul class="shortcut-list">
            <li><kbd data-shortcut="page">—</kbd><span data-copy="actions.copyPage"></span></li>
            <li>
              <kbd data-shortcut="selection">—</kbd><span data-copy="actions.copySelection"></span>
            </li>
            <li><kbd data-shortcut="link">—</kbd><span data-copy="actions.copyLink"></span></li>
          </ul>
          <p data-copy="notifications.markdownExplanation"></p>
        </div>
      </aside>
      <div class="status-slot">
        <p
          id="status"
          class="status"
          data-state="unavailable"
          role="status"
          aria-live="polite"
          hidden
        >
          <span class="status-icon" id="status-icon" aria-hidden="true"></span>
          <span class="status-label" data-copy="states.unavailable"></span>
        </p>
      </div>
      <div id="popup-toast" class="popup-toast" role="status" aria-live="polite" hidden>
        <span class="popup-toast-icon" aria-hidden="true"></span>
        <span class="popup-toast-message"></span>
      </div>
      <footer class="footer">
        <span class="footer-brand" data-copy="brand.name"></span>
        <a
          href="https://github.com/weluvabid/copy-2-markdown"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="footer-icon" id="source-icon" aria-hidden="true"></span>
          <span data-copy="footer.sourceCode"></span>
        </a>
      </footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
